[project]
name = "sentinelforge-backend"
version = "0.2.0"
description = "SentinelForge — Autonomous SOC War Room backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "asyncpg>=0.30.0",
    "redis[hiredis]>=5.2.0",
    "aiohttp>=3.10.0",
    "openai>=1.54.0",
    "chromadb>=0.5.20",
    "sentence-transformers>=3.3.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.3",
    "tenacity>=9.0.0",
    "tiktoken>=0.8.0",
    "orjson>=3.10.0",
    "websockets>=13.1",
    "mcp>=1.0.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
# UP017 rewrites timezone.utc -> datetime.UTC which is 3.11+ only; our local
# dev venv is 3.9 so keep the classic form. UP042 (str-enum) is cosmetic.
# E702 (semicolons) — pre-existing style in mock tools; out of scope for this pass.
ignore = ["E501", "E702", "UP017", "UP042", "B905", "B008", "ASYNC230"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
