[project]
name = "sentinelforge-backend"
version = "0.2.0"
description = "SentinelForge — Autonomous SOC War Room backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "asyncpg>=0.30.0",
    "redis[hiredis]>=5.2.0",
    "aiohttp>=3.10.0",
    "openai>=1.54.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.3",
    "prometheus-client>=0.21.0",
    "pyjwt>=2.10.0",
]

[project.optional-dependencies]
# Semantic runbook search. Without it, runbook search falls back to keywords.
rag = [
    "chromadb>=0.5.20",
    "sentence-transformers>=3.3.0",
]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
# E501: long strings (prompts, SQL) are clearer unwrapped; the formatter handles code.
# UP017/UP042: keep timezone.utc and (str, Enum) — purely cosmetic rewrites.
# B008: FastAPI's Depends()/Query() defaults are the framework idiom.
# B905: zip() without strict= is intentional where lengths are known equal.
ignore = ["E501", "UP017", "UP042", "B905", "B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
