# Development overrides — hot reload with source mounted into the containers.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  backend:
    command: ["sh", "-c", "alembic upgrade head && (python -m app.services.runbook_indexer || true) && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
    volumes:
      - ./backend:/app
      - chromadata:/app/.chroma

  worker:
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
    volumes:
      - ./backend:/app
      - chromadata:/app/.chroma

  frontend:
    build:
      target: builder
    command: ["sh", "-c", "npm install && npm run dev"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
