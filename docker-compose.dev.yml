# Development overrides — hot reload
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  backend:
    command: ["sh", "-c", "alembic upgrade head && python -m app.services.runbook_indexer || true && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG

  worker:
    command: ["python", "-m", "app.pipeline.orchestrator"]
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG

  frontend:
    command: ["sh", "-c", "npm install && npm run dev"]
    environment:
      ENVIRONMENT: development
